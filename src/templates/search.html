<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="refresh" content="0; url=../pages/search.php" />
  <title>Redirecting…</title>
  <script>
    const q = new URLSearchParams(window.location.search);
    const target = '../pages/search.php' + (q.toString() ? '?' + q.toString() : '');
    window.location.replace(target);
  </script>
</head>
<body>
  <p>Redirecting to <a href="../pages/search.php">search</a>…</p>
</body>
</html>
