<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Listings — Demy's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/main.css"/>
</head>
<body>

<header class="topbar">
  <a href="../index.html" class="topbar-logo">Demy's</a>
  <form class="topbar-search" onsubmit="handleSearch(event)">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" id="topbarQ" placeholder="Search deals…"/>
  </form>
  <nav class="topbar-nav" id="topbarNav"></nav>
</header>

<div id="flashContainer"></div>

<main class="page-main">
<div class="container">
  <section class="section">
    <div class="section-header">
      <h1 class="section-title">My Listings</h1>
      <a href="sell.php" class="btn-accent">+ New Listing</a>
    </div>

    <!-- Status tabs -->
    <div style="display:flex;gap:8px;margin-bottom:24px" id="statusTabs">
      <button class="btn-accent btn-sm" onclick="filterStatus('all', this)">All</button>
      <button class="btn-ghost btn-sm" onclick="filterStatus('active', this)">Active</button>
      <button class="btn-ghost btn-sm" onclick="filterStatus('sold', this)">Sold</button>
      <button class="btn-ghost btn-sm" onclick="filterStatus('archived', this)">Archived</button>
    </div>

    <div id="listingsContent">
      <div class="empty"><div class="empty-icon">⏳</div><h3>Loading…</h3></div>
    </div>
  </section>
</div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-logo">Demy's</span>
    <span class="footer-copy">© 2026 — Buy &amp; Sell community marketplace</span>
    <div class="footer-links">
      <a href="search.html">Browse</a><a href="sell.php">Sell</a>
    </div>
  </div>
</footer>

<script src="../assets/js/main.js"></script>
<script>
  let allItems = [];
  let currentStatus = 'all';

  function handleSearch(e) {
    e.preventDefault();
    window.location.href = `search.html?q=${encodeURIComponent(document.getElementById('topbarQ').value.trim())}`;
  }

  async function init() {
    const session = getSession();
    if (!session) { window.location.href = 'login.php'; return; }

    const items = await fetch('../data/items.json').then(r => r.json());
    // Show only this seller's items (using session userID)
    allItems = items.filter(i => i.sellerID === session.userID);

    render();
  }

  function filterStatus(status, btn) {
    currentStatus = status;
    document.querySelectorAll('#statusTabs button').forEach(b => {
      b.className = 'btn-ghost btn-sm';
    });
    btn.className = 'btn-accent btn-sm';
    render();
  }

  function render() {
    const filtered = currentStatus === 'all'
      ? allItems
      : allItems.filter(i => i.status === currentStatus);

    const container = document.getElementById('listingsContent');

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📦</div>
          <h3>No listings ${currentStatus !== 'all' ? `with status "${currentStatus}"` : 'yet'}</h3>
          <p><a href="sell.php" class="text-accent">Post your first item →</a></p>
        </div>`;
      return;
    }

    const statusBadge = (s) => {
      if (s === 'active')   return `<span class="badge badge-success">active</span>`;
      if (s === 'sold')     return `<span class="badge badge-accent">sold</span>`;
      return `<span class="badge">archived</span>`;
    };

    container.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Item</th><th>Category</th><th>Price</th><th>Status</th><th>Posted</th><th></th></tr>
          </thead>
          <tbody>
            ${filtered.map(item => `
              <tr>
                <td>
                  <div style="display:flex;align-items:center;gap:12px">
                    ${item.images?.[0]
                      ? `<img src="${item.images[0]}" style="width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--border)"/>`
                      : `<div style="width:44px;height:44px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px">📦</div>`}
                    <a href="item.html?id=${item.itemID}" style="font-weight:500">${item.title}</a>
                  </div>
                </td>
                <td><span class="badge">${item.category_name}</span></td>
                <td>${formatPrice(item.price)}</td>
                <td>${statusBadge(item.status)}</td>
                <td>${timeAgo(item.created_at)}</td>
                <td>
                  <div style="display:flex;gap:8px">
                    <a href="item.html?id=${item.itemID}" class="btn-ghost btn-sm">View</a>
                    <button class="btn-ghost btn-sm" style="color:var(--danger)"
                      onclick="archiveItem(${item.itemID}, this)">Remove</button>
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  function archiveItem(itemID, btn) {
    if (!confirm('Remove this listing?')) return;
    // In a real app this would call a PHP endpoint.
    // For demo, just visually remove it.
    const row = btn.closest('tr');
    row.style.opacity = '0.4';
    row.style.transition = '0.3s';
    setTimeout(() => {
      allItems = allItems.filter(i => i.itemID !== itemID);
      render();
      showFlash('info', 'Listing removed (demo mode — not persisted).');
    }, 400);
  }

  init();
</script>
</body>
</html>
