<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse — Demy's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/main.css"/>
</head>
<body>

<header class="topbar">
  <a href="../src/index.html" class="topbar-logo">Demy's</a>
  <form class="topbar-search" onsubmit="applySearch(event)">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" id="topbarQ" placeholder="Search deals…"/>
  </form>
  <nav class="topbar-nav" id="topbarNav"></nav>
</header>

<div id="flashContainer"></div>

<main class="page-main">
<div class="container">
  <section class="section">

    <!-- Filter bar -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:28px">
      <div class="topbar-search" style="flex:1;min-width:220px;max-width:380px">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchQ" placeholder="Search listings…"/>
      </div>
      <select id="filterCat" class="form-control" style="width:auto">
        <option value="0">All Categories</option>
      </select>
      <select id="filterSort" class="form-control" style="width:auto">
        <option value="newest">Newest</option>
        <option value="price_asc">Price ↑</option>
        <option value="price_desc">Price ↓</option>
      </select>
      <button class="btn-accent" onclick="applyFilters()">Search</button>
      <button class="btn-ghost" onclick="clearFilters()">Clear</button>
    </div>

    <!-- Result header -->
    <div class="section-header">
      <h2 class="section-title" id="resultsTitle">All Listings</h2>
      <span class="section-count" id="resultsCount"></span>
    </div>

    <!-- Grid -->
    <div class="grid-4" id="itemsGrid">
      <div class="empty" style="grid-column:1/-1">
        <div class="empty-icon">⏳</div>
        <h3>Loading…</h3>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>

  </section>
</div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-logo">Demy's</span>
    <span class="footer-copy">© 2026 — Buy &amp; Sell community marketplace</span>
    <div class="footer-links">
      <a href="search.html">Browse</a>
      <a href="sell.php">Sell</a>
    </div>
  </div>
</footer>

<script src="../assets/js/main.js"></script>
<script>
  const PER_PAGE = 12;
  let allItems = [];
  let allCats  = [];
  let currentPage = 1;

  function getParams() {
    return new URLSearchParams(window.location.search);
  }

  async function init() {
    [allCats, allItems] = await Promise.all([
      fetch('../src/dummy_data/categories.json').then(r => r.json()),
      fetch('../src/dummy_data/items.json').then(r => r.json())
    ]);

    // Populate category dropdown
    const catSel = document.getElementById('filterCat');
    allCats.forEach(c => {
      const o = document.createElement('option');
      o.value = c.categoryID;
      o.textContent = c.category_name;
      catSel.appendChild(o);
    });

    // Apply URL params to inputs
    const p = getParams();
    const q   = p.get('q')        || '';
    const cat = parseInt(p.get('category') || '0');
    const sort= p.get('sort')     || 'newest';
    currentPage = parseInt(p.get('page') || '1');

    document.getElementById('searchQ').value  = q;
    document.getElementById('topbarQ').value  = q;
    document.getElementById('filterCat').value  = cat;
    document.getElementById('filterSort').value = sort;

    render();
  }

  function applySearch(e) {
    e?.preventDefault();
    applyFilters();
  }

  function applyFilters() {
    const q    = document.getElementById('searchQ').value.trim();
    const cat  = document.getElementById('filterCat').value;
    const sort = document.getElementById('filterSort').value;
    currentPage = 1;
    const params = new URLSearchParams({ q, category: cat, sort, page: 1 });
    history.pushState({}, '', '?' + params.toString());
    render();
  }

  function clearFilters() {
    document.getElementById('searchQ').value    = '';
    document.getElementById('filterCat').value  = '0';
    document.getElementById('filterSort').value = 'newest';
    currentPage = 1;
    history.pushState({}, '', '?');
    render();
  }

  function render() {
    const p    = getParams();
    const q    = (p.get('q') || document.getElementById('searchQ').value || '').toLowerCase().trim();
    const cat  = parseInt(p.get('category') || document.getElementById('filterCat').value || '0');
    const sort = p.get('sort') || document.getElementById('filterSort').value || 'newest';

    let filtered = allItems.filter(i => i.status === 'active');
    if (q)   filtered = filtered.filter(i => i.title.toLowerCase().includes(q) || (i.description||'').toLowerCase().includes(q));
    if (cat) filtered = filtered.filter(i => i.categoryID === cat);

    if (sort === 'price_asc')  filtered.sort((a,b) => a.price - b.price);
    if (sort === 'price_desc') filtered.sort((a,b) => b.price - a.price);
    if (sort === 'newest')     filtered.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    const total = filtered.length;
    const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
    currentPage = Math.min(currentPage, totalPages);
    const slice = filtered.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);

    // Title & count
    document.getElementById('resultsTitle').textContent = q ? `Results for "${q}"` : 'All Listings';
    document.getElementById('resultsCount').textContent = `${total.toLocaleString()} item${total!==1?'s':''}`;

    // Grid
    const grid = document.getElementById('itemsGrid');
    if (slice.length === 0) {
      grid.innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <div class="empty-icon">🔍</div>
          <h3>No items found</h3>
          <p>Try adjusting your search.</p>
        </div>`;
    } else {
      grid.innerHTML = slice.map(i => itemCard(i, '../')).join('');
      applyWishState();
    }

    // Pagination
    const pg = document.getElementById('pagination');
    if (totalPages <= 1) { pg.innerHTML = ''; return; }
    let html = '';
    if (currentPage > 1) html += pageBtn(currentPage-1, '‹');
    for (let i=1; i<=totalPages; i++) html += pageBtn(i, i, i===currentPage);
    if (currentPage < totalPages) html += pageBtn(currentPage+1, '›');
    pg.innerHTML = html;
  }

  function pageBtn(page, label, active=false) {
    return `<button class="page-btn ${active?'active':''}" onclick="goPage(${page})">${label}</button>`;
  }

  function goPage(n) {
    currentPage = n;
    const p = new URLSearchParams(window.location.search);
    p.set('page', n);
    history.pushState({}, '', '?' + p.toString());
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  init();
</script>
</body>
</html>
