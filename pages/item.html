<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Item — Demy's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/main.css"/>
</head>
<body>

<header class="topbar">
  <a href="../src/index.html" class="topbar-logo">Demy's</a>
  <form class="topbar-search" onsubmit="handleSearch(event)">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" id="topbarQ" placeholder="Search deals…"/>
  </form>
  <nav class="topbar-nav" id="topbarNav"></nav>
</header>

<div id="flashContainer"></div>

<main class="page-main">
<div class="container">

  <!-- Loading state -->
  <div id="loadingState" class="empty" style="padding:80px 0">
    <div class="empty-icon">⏳</div><h3>Loading item…</h3>
  </div>

  <!-- Not found -->
  <div id="notFound" class="empty" style="display:none;padding:80px 0">
    <div class="empty-icon">😕</div>
    <h3>Item not found</h3>
    <p>It may have been removed or sold.</p>
    <a href="search.html" class="btn-accent" style="margin-top:16px;display:inline-block">Browse listings</a>
  </div>

  <!-- Item detail -->
  <div id="itemDetail" style="display:none">
    <div class="item-detail-grid">

      <!-- Gallery -->
      <div class="item-gallery">
        <div class="item-gallery-main">
          <img id="mainImg" src="" alt=""/>
        </div>
        <div class="item-gallery-thumbs" id="thumbsRow"></div>
      </div>

      <!-- Panel -->
      <div class="item-detail-panel">
        <div class="item-detail-cat mb-1" id="detailCat"></div>
        <h1 class="item-detail-title" id="detailTitle"></h1>
        <div class="item-detail-price" id="detailPrice"></div>
        <div id="detailStars"></div>
        <div class="item-detail-meta" id="detailMeta"></div>
        <p class="item-detail-desc" id="detailDesc"></p>
        <div class="item-detail-actions" id="detailActions"></div>
        <div class="seller-box mt-3" id="sellerBox"></div>
      </div>
    </div>

    <!-- Reviews -->
    <section class="section" style="padding-top:0" id="reviewsSection">
      <h2 class="section-title mb-3">Reviews</h2>
      <div class="grid-2" id="reviewsGrid"></div>
    </section>

    <!-- More from seller -->
    <section class="section" style="padding-top:0" id="moreSection">
      <div class="section-header">
        <h2 class="section-title">More listings</h2>
        <a href="search.html" class="section-link">Browse all →</a>
      </div>
      <div class="grid-4" id="moreGrid"></div>
    </section>
  </div>

</div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-logo">Demy's</span>
    <span class="footer-copy">© 2026 — Buy &amp; Sell community marketplace</span>
    <div class="footer-links">
      <a href="search.html">Browse</a><a href="sell.php">Sell</a>
    </div>
  </div>
</footer>

<script src="../assets/js/main.js"></script>
<script>
  function handleSearch(e) {
    e.preventDefault();
    const q = document.getElementById('topbarQ').value.trim();
    window.location.href = `search.html?q=${encodeURIComponent(q)}`;
  }

  function starsHTML(avg, count) {
    if (!count) return '';
    let s = '<div class="flex items-center gap-1 mb-2"><div class="stars">';
    for (let i=1;i<=5;i++) s += `<span class="star ${i<=avg?'filled':''}">★</span>`;
    s += `</div><span style="font-size:13px;color:var(--muted)">(${count} review${count!==1?'s':''})</span></div>`;
    return s;
  }

  async function loadItem() {
    const id = parseInt(new URLSearchParams(location.search).get('id') || '0');
    if (!id) { showNotFound(); return; }

    const items = await fetch('../data/items.json').then(r => r.json());
    const item  = items.find(i => i.itemID === id && i.status === 'active');
    if (!item) { showNotFound(); return; }

    document.title = `${item.title} — Demy's`;
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('itemDetail').style.display   = 'block';

    // Gallery
    const mainImg = document.getElementById('mainImg');
    mainImg.src = item.images[0] || '';
    mainImg.alt = item.title;

    const thumbs = document.getElementById('thumbsRow');
    if (item.images.length > 1) {
      thumbs.innerHTML = item.images.map((src, i) => `
        <div class="thumb ${i===0?'active':''}" onclick="switchImg(this,'${src}')">
          <img src="${src}" alt=""/>
        </div>`).join('');
    }

    // Meta
    document.getElementById('detailCat').innerHTML   = `<span class="badge">${item.category_name}</span>`;
    document.getElementById('detailTitle').textContent = item.title;
    document.getElementById('detailPrice').textContent = formatPrice(item.price);
    document.getElementById('detailStars').innerHTML   = starsHTML(item.avg_rating, item.rating_count);

    let meta = '';
    if (item.address) meta += `<span>📍 ${item.address}</span>`;
    meta += `<span>🕐 ${timeAgo(item.created_at)}</span>`;
    document.getElementById('detailMeta').innerHTML = meta;

    document.getElementById('detailDesc').innerHTML = (item.description||'').replace(/\n/g,'<br/>');

    // Actions
    const session = getSession();
    const isOwner = session && session.userID === item.sellerID;
    const wished  = isWished(item.itemID);
    let actions = '';
    if (!session) {
      actions = `<a href="login.php" class="btn-accent btn-lg" style="flex:1;text-align:center">Log in to Contact</a>`;
    } else if (isOwner) {
      actions = `<a href="sell.php?edit=${item.itemID}" class="btn-ghost btn-lg">Edit Listing</a>`;
    } else {
      actions = `
        <a href="messages.php?with=${item.sellerID}&item=${item.itemID}" class="btn-accent btn-lg" style="flex:1;text-align:center">💬 Message Seller</a>
        <button class="btn-ghost wish-btn ${wished?'wished':''}" data-item="${item.itemID}"
          onclick="toggleWish(${item.itemID}, this)"
          style="width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px">
          ${wished?'❤️':'🤍'}
        </button>`;
    }
    document.getElementById('detailActions').innerHTML = actions;

    // Seller
    document.getElementById('sellerBox').innerHTML = `
      <div class="seller-avatar">${item.seller_name[0].toUpperCase()}</div>
      <div>
        <div class="seller-name">${item.seller_name}</div>
        <div class="seller-since">Member since ${formatDate(item.seller_joined)}</div>
      </div>`;

    // Reviews (mock — from items data's rating_count)
    const revSection = document.getElementById('reviewsSection');
    if (item.rating_count > 0) {
      // Sample reviews generated from data
      const sampleTexts = [
        "Great item, exactly as described!",
        "Fast transaction, very trustworthy seller.",
        "Good condition, happy with the purchase.",
        "Highly recommended!"
      ];
      const revGrid = document.getElementById('reviewsGrid');
      const count = Math.min(item.rating_count, sampleTexts.length);
      let revHTML = '';
      for (let i=0; i<count; i++) {
        const stars = Math.max(3, item.avg_rating - (i===1?1:0));
        revHTML += `
          <div class="card card-body">
            <div class="flex items-center gap-2 mb-1">
              <div class="stars">${[1,2,3,4,5].map(s=>`<span class="star ${s<=stars?'filled':''}">★</span>`).join('')}</div>
              <span class="fw-600" style="font-size:14px">User${i+1}</span>
            </div>
            <p style="font-size:14px;color:var(--text-2);line-height:1.6">${sampleTexts[i]}</p>
          </div>`;
      }
      revGrid.innerHTML = revHTML;
    } else {
      revSection.style.display = 'none';
    }

    // More from same category
    const more = items.filter(i => i.itemID !== id && i.status === 'active' && i.categoryID === item.categoryID).slice(0,4);
    if (more.length) {
      document.getElementById('moreGrid').innerHTML = more.map(i => itemCard(i, '../')).join('');
      applyWishState();
    } else {
      document.getElementById('moreSection').style.display = 'none';
    }
  }

  function switchImg(thumb, src) {
    document.getElementById('mainImg').src = src;
    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
    thumb.classList.add('active');
  }

  function showNotFound() {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('notFound').style.display     = 'block';
  }

  function formatDate(str) {
    return new Date(str).toLocaleDateString('en-US', {month:'short', year:'numeric'});
  }

  loadItem();
</script>
</body>
</html>
